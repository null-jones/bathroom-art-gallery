description: |-
  Cross-stitch is a form of fibre art with ancient origins. In the 1960s it saw a revival, becoming a popular creative pastime at home, valued for its accessibility and its calming rhythm.

  This piece was made between the 1960s and 1980s. Its close, even stitches and clear colours show the patience and skill the technique demands.

  It was bought at a thrift store in Calgary and is kept in its original condition, in the period teak frame its maker chose.

