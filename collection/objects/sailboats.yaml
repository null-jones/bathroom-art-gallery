image_alt: Oil painting of a white sailboat on a calm harbour between brown hills, with smaller sails in the distance, under a pale grey-blue sky.

label: >-
  Imelda “Moe” Wellner painted scenes from her own life, many of them on
  Prince Edward Island. Here a white sailboat crosses a still harbour, most
  likely Charlottetown’s, with smaller sails beyond. The artist was the
  great-grandmother of Ellie Jones.

description: |-
  A white sailboat crosses a still harbour on Prince Edward Island, most likely at Charlottetown. Smaller sails dot the channel beyond, between low brown hills under a pale, even sky.

  The painting entered the collection as a gift from Mike and Stephanie Jones.

artist_bio: >-
  Imelda “Moe” Wellner was a prolific painter and the great-grandmother of
  Ellie Jones. Her paintings depict scenes from her own life, many of them on
  Prince Edward Island, and are kept by her family across Canada.

